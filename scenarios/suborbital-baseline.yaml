# Project Aphelion — Baseline Suborbital Scenario
# Reproduces the baseline configuration used by the original standalone
# propagator (superseded by the aphelion/ package in Level 0).

vehicle:
  dry_mass: 1.0          # kg
  propellant_mass: 0.3   # kg
  area: 0.008            # m^2 (cross-sectional area)
  cd: 0.45               # drag coefficient (dimensionless)
  thrust_nominal: 80.0   # N
  burn_time: 3.5         # s

initial_conditions:
  launch_angle_deg: 85.0  # degrees from horizontal
  rail_speed: 0.1         # m/s (speed at rail departure)

simulation:
  dt: 0.01                # s (integration time step)
  max_duration: 40.0      # s (maximum simulation time)
